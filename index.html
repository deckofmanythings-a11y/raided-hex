<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Raided Hex</title>
<script src="supabase-js.bundle.js?v=1"></script>
<script src="discord-embedded-app-sdk.js?v=1"></script>
<style>
  :root{color-scheme:dark;}
  body{margin:0;font-family:system-ui,sans-serif;background:#14101c;color:#eee0f5;min-height:100vh;}
  #auth-status{display:none;padding:40px;text-align:center;font-size:14px;opacity:.8;}
  #auth-status.show{display:block;}
  #auth-discord-debug{font-size:11px;color:rgba(255,255,255,.5);margin-top:8px;word-break:break-word;font-family:monospace;text-align:center;}
  .screen{display:none;max-width:480px;margin:0 auto;padding:20px;}
  .screen.show{display:block;}
  h1{font-size:20px;margin:0 0 16px;}
  label{display:block;margin:14px 0 4px;font-size:13px;opacity:.8;}
  input[type=text]{width:100%;box-sizing:border-box;padding:8px;border-radius:6px;border:1px solid #5a4a70;background:#221a30;color:#eee0f5;}
  .class-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .class-card{border:1px solid #5a4a70;border-radius:8px;padding:10px;cursor:pointer;background:#221a30;}
  .class-card.selected{border-color:#b48ce8;background:#33254a;}
  .class-card b{display:block;font-size:14px;}
  .class-card span{font-size:11px;opacity:.7;}
  button{margin-top:18px;width:100%;padding:10px;border-radius:8px;border:none;background:#8452c9;color:#fff;font-size:15px;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  #char-sheet{padding:16px;border:1px solid #5a4a70;border-radius:10px;background:#1c1526;}
  #char-sheet .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
  #attack-log{margin-top:14px;font-size:13px;max-height:200px;overflow-y:auto;}
  #attack-log div{padding:6px 0;border-bottom:1px solid #33254a;}
  .dead-banner{background:#4a1622;border:1px solid #7a2a3d;border-radius:8px;padding:14px;text-align:center;margin-bottom:14px;}
  .error-msg{color:#ff8a9a;font-size:13px;margin-top:8px;min-height:16px;}
  .section-title{font-size:14px;margin:18px 0 8px;opacity:.85;}
  .equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .equip-slot{border:1px solid #3a2d4d;border-radius:6px;padding:6px 8px;font-size:12px;background:#1c1526;}
  .equip-slot .slot-name{opacity:.6;text-transform:capitalize;}
  .equip-slot .item-name{display:block;margin-top:2px;}
  .rarity-common{color:#c9c2d6;}
  .rarity-uncommon{color:#7fd992;}
  .rarity-rare{color:#7fb8ff;}
  .rarity-epic{color:#c98fff;}
  .rarity-legendary{color:#ffb347;}
  .bag-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #3a2d4d;border-radius:6px;padding:8px;margin-bottom:6px;font-size:13px;}
  .bag-item .actions{display:flex;gap:6px;}
  .bag-item button{margin:0;width:auto;padding:5px 10px;font-size:12px;}
  .bag-item .sell-btn{background:#4a3560;}
  .loot-drop{color:#ffd27a;}
  .store-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #3a2d4d;border-radius:6px;padding:8px;margin-bottom:6px;font-size:13px;}
  .store-item .buy-btn{margin:0;width:auto;padding:5px 10px;font-size:12px;}
  .store-price{opacity:.7;font-size:11px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:8px 0;}
  .stat-grid .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
  .stat-grid .row span:first-child{opacity:.65;}
  .wounds{letter-spacing:2px;font-size:15px;}
  .effect-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;margin-top:3px;background:#3a2d4d;color:#ffd27a;}
  .round-line{font-size:12px;opacity:.85;padding:2px 0;}
  .round-line.crit{color:#ffd27a;}
  .fight-summary{font-weight:600;margin-top:4px;}
  .mortal-wound-line{color:#ff6b81;font-weight:600;}
  .permadeath-line{color:#ff2d4d;font-weight:700;}
  #version-tag{position:fixed;bottom:6px;right:8px;font-size:10px;opacity:.4;font-family:monospace;z-index:999;}
  .mausoleum-entry{border:1px solid #3a2d4d;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;background:#181220;}
  .mausoleum-entry .epitaph{font-style:italic;opacity:.55;font-size:11px;margin-top:2px;}
  .mausoleum-entry b{color:#c9c2d6;}
</style>
</head>
<body>

<div id="auth-status">Connecting…</div>
<div id="version-tag"></div>

<div id="screen-create" class="screen">
  <h1>Create Your Character</h1>
  <label for="char-name">Name</label>
  <input type="text" id="char-name" maxlength="24" placeholder="Kaelith the Bold">
  <label>Class</label>
  <div class="class-grid" id="class-grid"></div>
  <button id="create-btn" disabled>Begin Your Legend</button>
  <div class="error-msg" id="create-error"></div>
</div>

<div id="screen-game" class="screen">
  <h1>Raided Hex</h1>
  <div id="dead-banner" class="dead-banner" style="display:none">
    Your character has fallen. <button id="reroll-btn" style="width:auto;padding:6px 14px;">Create a new character</button>
  </div>
  <div id="char-sheet"></div>
  <div id="boss-info" style="margin-top:14px;font-size:14px;"></div>
  <button id="attack-btn">Attack</button>
  <div class="error-msg" id="attack-error"></div>
  <div id="attack-log"></div>

  <div class="section-title">Equipped</div>
  <div class="equip-grid" id="equip-grid"></div>

  <div class="section-title">Bag</div>
  <div id="bag-list"></div>

  <div class="section-title">Auction House (today's stock)</div>
  <div id="store-list"></div>

  <div class="section-title">🪦 Mausoleum</div>
  <div id="mausoleum-list"></div>
</div>

<script>
// ── Version ──────────────────────────────────────────────────────────────
// Bumped on every push so it's obvious in-app whether you're looking at the
// latest deployed build (GitHub Pages + Discord's Activity iframe can both cache
// aggressively) -- shown as a small tag, bottom-right, on every screen.
const APP_VERSION='0.2.0';
document.getElementById('version-tag').textContent='v'+APP_VERSION;

// ── Config ───────────────────────────────────────────────────────────────
// isDiscordActivity() detection and the /.proxy/supabase URL rewrite mirror
// heavenly-aces-casino/index.html exactly -- Discord Activities can only reach
// external hosts through URL Mappings configured in the Developer Portal, which
// rewrite a path prefix (here /.proxy/supabase) to the real Supabase origin.
function isDiscordActivity(){return location.hostname.endsWith('.discordsays.com')||new URLSearchParams(location.search).has('frame_id');}
function isDiscordDM(){const loc=new URLSearchParams(location.search).get('location_id');return !!loc&&loc.startsWith('pc-');}
function withTimeout(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out')),ms))]);}

// TODO fill in after creating the Supabase project and Discord application (see README.md).
const SUPABASE_URL=isDiscordActivity()?(location.origin+'/.proxy/supabase'):'https://uaoxvhihwiygrajicend.supabase.co';
const FUNCTIONS_URL=SUPABASE_URL+'/functions/v1';
const SUPABASE_ANON_KEY='sb_publishable_91Zn_uJ9anW46vAClx6-bQ__wLL4fXl';
const DISCORD_CLIENT_ID='1534237310915182772';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{fetch:(url,options)=>fetch(url,{...options,cache:'no-store'})}});

let session=null;   // {session_token}
let account=null;
let character=null;

async function callFn(name,payload){
  const res=await fetch(FUNCTIONS_URL+'/'+name,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(payload||{})
  });
  return res.json();
}

// ── Discord entry ────────────────────────────────────────────────────────
async function runDiscordEntry(){
  const statusEl=document.getElementById('auth-status');
  statusEl.classList.add('show');
  try{
    const {DiscordSDK}=window.DiscordSDKLib;
    const discordSdk=new DiscordSDK(DISCORD_CLIENT_ID);
    await withTimeout(discordSdk.ready(),20000,'Discord SDK ready()');
    let code;
    try{
      ({code}=await discordSdk.commands.authorize({client_id:DISCORD_CLIENT_ID,response_type:'code',state:'',prompt:'none',scope:['identify']}));
    }catch(e){
      ({code}=await discordSdk.commands.authorize({client_id:DISCORD_CLIENT_ID,response_type:'code',state:'',prompt:'consent',scope:['identify']}));
    }
    const data=await callFn('discord-auth',{code});
    if(!data.ok||!data.account)throw new Error(data.message||'Discord sign-in failed.');
    localStorage.setItem('raided_hex_session',data.account.session_token);
    boot(data.account,data.character);
  }catch(e){
    console.error('Discord entry failed:',e);
    await tryRestoreSession();
    if(!account)showDiscordConnectError(e);
  }finally{
    if(account)statusEl.classList.remove('show');
  }
}
function showDiscordConnectError(e){
  const msg=(e&&(e.message||e.toString()))||'Unknown error';
  let debugEl=document.getElementById('auth-discord-debug');
  if(!debugEl){
    debugEl=document.createElement('div');
    debugEl.id='auth-discord-debug';
    document.getElementById('auth-status').insertAdjacentElement('afterend',debugEl);
  }
  debugEl.textContent='Debug: '+msg;
}
async function tryRestoreSession(){
  const token=localStorage.getItem('raided_hex_session');
  if(!token)return;
  const data=await callFn('whoami',{session_token:token}).catch(e=>({ok:false,message:String(e)}));
  if(!data.ok||!data.account){localStorage.removeItem('raided_hex_session');return;}
  boot({...data.account,session_token:token},data.character);
}
async function bootDiscordDM(){
  await tryRestoreSession();
  if(!account)await runDiscordEntry();
}

// ── Screens ──────────────────────────────────────────────────────────────
function boot(acct,char){
  account=acct;
  character=char;
  session=acct.session_token;
  if(character){showGameScreen();}else{showCreateScreen();}
}

const CLASSES=[
  {id:'warrior',name:'Warrior',desc:'Frontline melee bruiser'},
  {id:'mage',name:'Mage',desc:'Ranged arcane damage'},
  {id:'rogue',name:'Rogue',desc:'High-agility burst striker'},
  {id:'cleric',name:'Cleric',desc:'Durable support/damage hybrid'},
  {id:'ranger',name:'Ranger',desc:'Consistent physical ranged damage'},
];
let selectedClass=null;

function showCreateScreen(){
  document.getElementById('screen-create').classList.add('show');
  document.getElementById('screen-game').classList.remove('show');
  const grid=document.getElementById('class-grid');
  grid.innerHTML='';
  CLASSES.forEach(c=>{
    const card=document.createElement('div');
    card.className='class-card';
    card.innerHTML=`<b>${c.name}</b><span>${c.desc}</span>`;
    card.onclick=()=>{selectedClass=c.id;[...grid.children].forEach(el=>el.classList.remove('selected'));card.classList.add('selected');validateCreateForm();};
    grid.appendChild(card);
  });
}
function validateCreateForm(){
  const name=document.getElementById('char-name').value.trim();
  document.getElementById('create-btn').disabled=!(name&&selectedClass);
}
document.getElementById('char-name').addEventListener('input',validateCreateForm);
document.getElementById('create-btn').addEventListener('click',async()=>{
  const name=document.getElementById('char-name').value.trim();
  const errEl=document.getElementById('create-error');
  errEl.textContent='';
  const data=await callFn('create-character',{session_token:session,name,class:selectedClass});
  if(!data.ok){errEl.textContent=data.message||'Could not create character.';return;}
  character=data.character;
  showGameScreen();
});

function showGameScreen(){
  document.getElementById('screen-create').classList.remove('show');
  document.getElementById('screen-game').classList.add('show');
  renderCharSheet();
  loadInventory();
  loadStore();
  loadMausoleum();
}

// ── Mausoleum: memorial for permadeath'd characters ────────────────────────
async function loadMausoleum(){
  const{data,error}=await sb.from('characters')
    .select('name, class, level, gold, died_at, bosses:died_to_boss_id(name)')
    .eq('alive',false)
    .order('died_at',{ascending:false});
  const list=document.getElementById('mausoleum-list');
  if(error){console.error('loadMausoleum failed',error);list.innerHTML='';return;}
  if(!data||data.length===0){list.innerHTML='<div style="font-size:12px;opacity:.5;">No fallen heroes yet.</div>';return;}
  list.innerHTML=data.map(c=>{
    const date=c.died_at?new Date(c.died_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'unknown date';
    const bossName=c.bosses?.name||'an unknown foe';
    return `<div class="mausoleum-entry">
      <b>${c.name}</b> — Lv ${c.level} ${c.class}, ${c.gold} gold to their name
      <div class="epitaph">Fell to ${bossName} on ${date}</div>
    </div>`;
  }).join('');
}

// ── Auction house (daily system store, not player trading) ────────────────
let storeListings=[];
async function loadStore(){
  const{data,error}=await sb.from('auction_listings')
    .select('id, price, items(id, name, slot, rarity, rolled_stats, effects, class_restriction)')
    .is('seller_character_id',null)
    .is('sold_at',null)
    .order('price',{ascending:true});
  if(error){console.error('loadStore failed',error);return;}
  storeListings=data||[];
  renderStore();
}
function renderStore(){
  const list=document.getElementById('store-list');
  if(storeListings.length===0){list.innerHTML='<div style="font-size:12px;opacity:.5;">Sold out for today.</div>';return;}
  list.innerHTML=storeListings.map(listing=>{
    const it=listing.items;
    const restricted=it.class_restriction&&it.class_restriction!==character.class;
    const tooExpensive=character.gold<listing.price;
    return `<div class="store-item">
      <div><span class="rarity-${it.rarity}">${it.name}</span> <span style="font-size:11px;">${formatClassLabel(it.class_restriction)}</span><br><span style="opacity:.6;font-size:11px;">${formatStats(it.rolled_stats)}</span>${formatEffects(it.effects)}<br><span class="store-price">${listing.price} gold</span></div>
      <button class="buy-btn" data-buy="${listing.id}" ${restricted||tooExpensive?'disabled':''} title="${restricted?'Wrong class':tooExpensive?'Not enough gold':''}">Buy</button>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-buy]').forEach(btn=>btn.addEventListener('click',()=>buyFromStore(btn.dataset.buy)));
}
async function buyFromStore(listingId){
  const data=await callFn('auction-buy',{session_token:session,listing_id:listingId});
  if(!data.ok){alert(data.message||'Purchase failed.');return;}
  character.gold=data.new_gold_total;
  renderCharSheet();
  await Promise.all([loadStore(),loadInventory()]);
}

// ── Inventory ────────────────────────────────────────────────────────────
const EQUIP_SLOTS=['weapon','head','chest','hands','legs','feet','trinket'];
let inventory=[]; // rows: {id, equipped_slot, items:{id,name,slot,rarity,rolled_stats,class_restriction}}

async function loadInventory(){
  if(!character)return;
  const{data,error}=await sb.from('character_inventory')
    .select('id, equipped_slot, items(id, name, slot, rarity, rolled_stats, effects, class_restriction)')
    .eq('character_id',character.id);
  if(error){console.error('loadInventory failed',error);return;}
  inventory=data||[];
  renderInventory();
  renderCharSheet();
}
function formatStats(stats){
  if(!stats)return'';
  return Object.entries(stats).map(([k,v])=>`${k.toUpperCase()} +${v}`).join(' · ');
}
function formatClassLabel(classRestriction){
  if(!classRestriction)return'<span style="opacity:.5;">Any class</span>';
  const label=classRestriction.charAt(0).toUpperCase()+classRestriction.slice(1);
  const mismatch=character&&classRestriction!==character.class;
  return `<span style="${mismatch?'color:#ff8a9a;':'opacity:.5;'}">${label} only</span>`;
}
function formatEffects(effects){
  if(!effects)return'';
  const badges=[];
  if(effects.prevents_mortal_wound)badges.push('Prevents a Mortal Wound (breaks)');
  if(effects.mortal_wound_capacity)badges.push(`+${effects.mortal_wound_capacity} Mortal Wound capacity`);
  return badges.map(b=>`<span class="effect-badge">${b}</span>`).join('');
}
function renderInventory(){
  const equipGrid=document.getElementById('equip-grid');
  equipGrid.innerHTML=EQUIP_SLOTS.map(slot=>{
    const row=inventory.find(r=>r.equipped_slot===slot);
    return `<div class="equip-slot"><span class="slot-name">${slot}</span>${row?`<span class="item-name rarity-${row.items.rarity}">${row.items.name}</span>${formatEffects(row.items.effects)}`:'<span class="item-name" style="opacity:.4">Empty</span>'}</div>`;
  }).join('');

  const bagList=document.getElementById('bag-list');
  const bagRows=inventory.filter(r=>!r.equipped_slot);
  if(bagRows.length===0){bagList.innerHTML='<div style="font-size:12px;opacity:.5;">Nothing in your bag yet.</div>';return;}
  bagList.innerHTML=bagRows.map(row=>{
    const it=row.items;
    const restricted=it.class_restriction&&it.class_restriction!==character.class;
    return `<div class="bag-item">
      <div><span class="rarity-${it.rarity}">${it.name}</span> <span style="font-size:11px;">${formatClassLabel(it.class_restriction)}</span><br><span style="opacity:.6;font-size:11px;">${formatStats(it.rolled_stats)}</span>${formatEffects(it.effects)}</div>
      <div class="actions">
        <button data-eq="${row.id}" ${restricted?'disabled title="Wrong class"':''}>Equip</button>
        <button class="sell-btn" data-sell="${row.id}">Sell</button>
      </div>
    </div>`;
  }).join('');
  bagList.querySelectorAll('[data-eq]').forEach(btn=>btn.addEventListener('click',()=>equipItem(btn.dataset.eq)));
  bagList.querySelectorAll('[data-sell]').forEach(btn=>btn.addEventListener('click',()=>sellItem(btn.dataset.sell)));
}
// Mirrors _shared/combat.ts::computeDerivedStats exactly -- display-only here, the
// server is the sole authority on what these values actually do in combat.
function computeDerivedStats(stats,gearBonus,level){
  const str=(stats.str||0)+(gearBonus.str||0);
  const agi=(stats.agi||0)+(gearBonus.agi||0);
  const intl=(stats.int||0)+(gearBonus.int||0);
  const vit=(stats.vit||0)+(gearBonus.vit||0);
  return{
    max_hp:Math.round(50+vit*8+level*10),
    attack_power:Math.round(str+agi*0.5+intl*0.5+level*2),
    defense:Math.round(vit*1.5+agi*0.5),
    crit_chance:Math.min(0.5,Math.max(0,0.05+agi*0.003)),
    crit_multiplier:1.5
  };
}
// Mirrors _shared/combat.ts::xpToNextLevel / computeLevelUp exactly.
function xpToNextLevel(level){return 100*level;}
function computeLevelUp(currentXp,currentLevel,xpGained){
  let xp=currentXp+xpGained,level=currentLevel,levelsGained=0;
  while(xp>=xpToNextLevel(level)){xp-=xpToNextLevel(level);level+=1;levelsGained+=1;}
  return{xp,level,levelsGained};
}
function gearBonusFromEquipped(){
  const bonus={};
  inventory.filter(r=>r.equipped_slot).forEach(r=>{
    const s=r.items.rolled_stats||{};
    for(const[k,v]of Object.entries(s))bonus[k]=(bonus[k]||0)+v;
  });
  return bonus;
}
function effectiveMaxWounds(){
  return 3+inventory.reduce((sum,r)=>sum+(r.items.effects?.mortal_wound_capacity||0),0);
}
async function equipItem(inventoryId){
  const data=await callFn('equip-item',{session_token:session,inventory_id:inventoryId});
  if(!data.ok){alert(data.message||'Equip failed.');return;}
  await loadInventory();
}
async function sellItem(inventoryId){
  const data=await callFn('sell-item',{session_token:session,inventory_id:inventoryId});
  if(!data.ok){alert(data.message||'Sell failed.');return;}
  character.gold=data.new_gold_total;
  renderCharSheet();
  await loadInventory();
}
function renderCharSheet(){
  const sheet=document.getElementById('char-sheet');
  const deadBanner=document.getElementById('dead-banner');
  const attackBtn=document.getElementById('attack-btn');
  if(!character){sheet.innerHTML='';return;}
  if(!character.alive){
    deadBanner.style.display='block';
    attackBtn.disabled=true;
  }else{
    deadBanner.style.display='none';
    attackBtn.disabled=character.attempts_remaining_today<=0;
  }
  const stats=computeDerivedStats(character.stats,gearBonusFromEquipped(),character.level);
  const maxWounds=effectiveMaxWounds();
  const wounds='☠️'.repeat(character.mortal_wounds)+'○'.repeat(Math.max(0,maxWounds-character.mortal_wounds));
  const xpNeeded=xpToNextLevel(character.level);
  sheet.innerHTML=`
    <div class="row"><b>${character.name}</b><span>Lv ${character.level} ${character.class}</span></div>
    <div class="row"><span>XP</span><span>${character.xp} / ${xpNeeded}</span></div>
    <div class="stat-grid">
      <div class="row"><span>Max HP</span><span>${stats.max_hp}</span></div>
      <div class="row"><span>Attack</span><span>${stats.attack_power}</span></div>
      <div class="row"><span>Defense</span><span>${stats.defense}</span></div>
      <div class="row"><span>Crit Chance</span><span>${Math.round(stats.crit_chance*100)}%</span></div>
      <div class="row"><span>Crit Damage</span><span>${stats.crit_multiplier}x</span></div>
      <div class="row"><span>Attempts left</span><span>${character.attempts_remaining_today}</span></div>
    </div>
    <div class="row"><span>Gold</span><span>${character.gold}</span></div>
    <div class="row"><span>Mortal Wounds</span><span class="wounds">${wounds}</span></div>
  `;
}
document.getElementById('reroll-btn').addEventListener('click',()=>{character=null;showCreateScreen();});
// A long fight (dozens of rounds) shows the opening, the final (fatal) round, and a
// count of what happened in between -- matches the condensed format used in the
// Discord slash command reply (discord-interactions/index.ts::formatRounds).
function renderRounds(rounds){
  const frag=document.createDocumentFragment();
  const roundLine=r=>{
    const el=document.createElement('div');
    el.className='round-line'+(r.crit?' crit':'');
    el.textContent=`R${r.round}: you hit for ${r.player_damage}${r.crit?' (crit!)':''}, boss hits back for ${r.boss_damage_taken} (HP ${r.hp_remaining})`;
    return el;
  };
  const shown=rounds.length<=6?rounds:[...rounds.slice(0,2),null,...rounds.slice(-2)];
  shown.forEach(r=>{
    if(r===null){
      const el=document.createElement('div');
      el.className='round-line';
      el.style.opacity='.5';
      el.textContent=`(${rounds.length-4} more rounds...)`;
      frag.appendChild(el);
    }else{
      frag.appendChild(roundLine(r));
    }
  });
  return frag;
}
document.getElementById('attack-btn').addEventListener('click',async()=>{
  const errEl=document.getElementById('attack-error');
  const btn=document.getElementById('attack-btn');
  errEl.textContent='';
  btn.disabled=true;
  const data=await callFn('attack-boss',{session_token:session});
  btn.disabled=false;
  if(!data.ok){errEl.textContent=data.message||'Attack failed.';return;}
  character.attempts_remaining_today=data.attempts_remaining;
  character.mortal_wounds=(character.mortal_wounds||0)+(data.mortal_wound.landed?1:0);
  if(data.permadeath)character.alive=false;
  const lvl=computeLevelUp(character.xp,character.level,data.xp_gained);
  character.xp=lvl.xp;character.level=lvl.level;

  const log=document.getElementById('attack-log');
  const fightBlock=document.createElement('div');
  fightBlock.appendChild(renderRounds(data.rounds));
  const summary=document.createElement('div');
  summary.className='fight-summary';
  summary.textContent=`Defeated after ${data.rounds.length} round${data.rounds.length===1?'':'s'} — dealt ${data.total_damage_to_boss} damage. Boss total: ${data.total_damage_all_time}.`;
  fightBlock.appendChild(summary);

  if(data.mortal_wound.prevented_by_item){
    const el=document.createElement('div');
    el.className='mortal-wound-line';
    el.textContent=`A Mortal Wound would have landed, but ${data.mortal_wound.prevented_by_item} shattered to protect you.`;
    fightBlock.appendChild(el);
  }else if(data.mortal_wound.landed){
    const el=document.createElement('div');
    el.className=data.permadeath?'permadeath-line':'mortal-wound-line';
    el.textContent=data.permadeath?'Your character has succumbed to their wounds. Permadeath.':'You suffered a Mortal Wound.';
    fightBlock.appendChild(el);
  }

  if(data.levels_gained>0){
    const el=document.createElement('div');
    el.className='fight-summary';
    el.style.color='#ffd27a';
    el.textContent=`⭐ Reached level ${data.new_level}!`;
    fightBlock.appendChild(el);
  }

  (data.items_dropped||[]).forEach(it=>{
    const lootEntry=document.createElement('div');
    lootEntry.className='loot-drop';
    lootEntry.textContent=`Loot! ${it.rarity} ${it.name} (${formatStats(it.rolled_stats)})`;
    fightBlock.appendChild(lootEntry);
  });

  log.appendChild(fightBlock);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight;});});
  renderCharSheet();
  await loadInventory();
});

// ── Entry point ──────────────────────────────────────────────────────────
if(isDiscordActivity()){
  if(isDiscordDM()){bootDiscordDM();}else{runDiscordEntry();}
}else{
  tryRestoreSession();
}
</script>
